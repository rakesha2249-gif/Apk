name: Build Motorola framework APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reassemble APK and verify
        shell: bash
        run: |
          set -euo pipefail
          cat input/framework-res.apk.part-* > framework-res.apk
          sha256sum -c input/SHA256SUMS
          unzip -tqq framework-res.apk
      - name: Download Apktool
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          api='https://api.github.com/repos/iBotPeaches/Apktool/releases/latest'
          req=urllib.request.Request(api,headers={'User-Agent':'Motorola-Framework-APK-Editor'})
          with urllib.request.urlopen(req) as r: data=json.load(r)
          assets=[a for a in data['assets'] if a['name'].endswith('.jar') and 'apktool' in a['name'].lower()]
          if not assets: raise SystemExit('No apktool jar found in latest release')
          urllib.request.urlretrieve(assets[0]['browser_download_url'],'apktool.jar')
          print('Using:',assets[0]['name'])
          PY
      - name: Decode APK
        run: java -jar apktool.jar d framework-res.apk -o decoded -f
      - name: Remove target message only
        run: python3 scripts/patch_strings.py
      - name: Rebuild APK
        run: |
          mkdir -p output
          java -jar apktool.jar b decoded -o output/framework-res-modified.apk
      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: framework-res-modified
          path: output/framework-res-modified.apk
          
