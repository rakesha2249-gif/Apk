name: Motorola Framework Strict Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reassemble and verify input
        shell: bash
        run: |
          set -euo pipefail
          cat input/framework-res.apk.part-01 input/framework-res.apk.part-02 input/framework-res.apk.part-03 > framework-res.apk
          echo 'da0182cfd30464413e47935c9bed2ef2d0ca40c5b9ece40055cb8e26e0b8eede  framework-res.apk' | sha256sum -c -
          unzip -tqq framework-res.apk

      - name: Install Apktool
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          req = urllib.request.Request('https://api.github.com/repos/iBotPeaches/Apktool/releases/latest', headers={'User-Agent':'Motorola-Strict-Builder'})
          with urllib.request.urlopen(req) as response:
              data = json.load(response)
          jars = [a for a in data['assets'] if a['name'].lower().startswith('apktool') and a['name'].endswith('.jar')]
          if len(jars) != 1:
              raise SystemExit('Cannot uniquely identify Apktool JAR')
          urllib.request.urlretrieve(jars[0]['browser_download_url'], 'apktool.jar')
          PY
          java -jar apktool.jar --version

      - name: Decode APK
        run: java -jar apktool.jar d framework-res.apk -o decoded -f

      - name: Snapshot decoded resources
        run: |
          mkdir -p verification
          cp -a decoded/res verification/res-before

      - name: Patch only target strings
        run: python3 scripts/patch_strings.py

      - name: Verify decoded edits
        run: python3 scripts/verify_build.py

      - name: Rebuild unsigned APK
        run: |
          mkdir -p output
          java -jar apktool.jar b decoded -o output/framework-res-modified.apk
          unzip -tqq output/framework-res-modified.apk

      - name: Verify APK paths strictly
        run: python3 scripts/verify_build.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Motorola-Verification-Reports
          path: verification/
          if-no-files-found: warn

      - name: Upload unsigned APK only if checks pass
        uses: actions/upload-artifact@v4
        with:
          name: Motorola-Unsigned-APK-NOT-FOR-FLASHING
          path: output/framework-res-modified.apk
          if-no-files-found: error
          
